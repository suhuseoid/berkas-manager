[package]
name = "lemari"
version = "0.1.0"
description = "Lemari - brankas file terenkripsi berkamuflase folder"
edition = "2021"

[lib]
name = "lemari_lib"
path = "src/lib.rs"

[[bin]]
name = "lemari"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
